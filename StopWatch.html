<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body{
            height: 100%;
            width: 100%;
            background-color: antiquewhite;
        }

        .cont{
            height: 200px;
            width: 500px;
            /* border: 1px solid red; */
            margin: 100px auto;
            padding: 1rem;
        }
        .cont .watch{
            width: 70%;
            height: 50%;
            border: 1px solid rgb(205, 197, 50);
            text-align: center;
            padding: 5px;
            font-size: 3.3rem;
        }

        .cont .btn{
            margin: 18px 0 0 22px;
            font-size: 1.5rem;
            padding: 5px 15px;
            color: rgb(255, 251, 235);
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:nth-of-type(1)
         {
            background-color: rgb(0, 164, 90);
          }
          .btn:nth-of-type(2){
            background-color: rgb(164, 0, 22);
          }
          .btn:nth-of-type(3){
            background-color: rgb(98, 98, 98);
          }
      
    </style>
</head>
<body>
    <div class="cont">
        <div class="watch">
        <span class="min">00</span>
        <span>:</span>
        <span class="sec">00</span>
        <span>:</span>
        <span class="milisec">00</span>
        </div>
        <button id="btn1" class="btn">Start</button>
        <button id="btn2" class="btn">Stop</button>
        <button id="btn3" class="btn">Reset</button>
    </div>

    <script src="stopwatch.js"></script>
</body>
</html>
